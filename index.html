<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscrição no evento</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Inscrição no evento</h1>
        <form id="formInscricao">
            <label for="nome">Nome
                <input id="nome" name="nome" autocomplete="name" required pattern=".*\S.*">
            </label>
            <label for="email">E-mail
                <input id="email" name="email" type="email" autocomplete="email" required>
            </label>
            <label for="estado">Estado
                <select id="estado" name="estado" required disabled>
                    <option value="">Carregando estados...</option>
                </select>
            </label>
            <div id="camposCidade" hidden>
                <label for="filtro">Filtrar cidades
                    <input id="filtro" type="search" placeholder="Digite parte do nome da cidade" disabled>
                </label>
                <label for="cidade">Cidade
                    <select id="cidade" name="cidade" required disabled></select>
                </label>
            </div>
            <button id="inscrever" type="submit" disabled>Inscrever</button>
        </form>
        <p id="qtdCidades" role="status"></p>
        <p id="erro" role="alert"></p>
        <button id="tentarNovamente" type="button" hidden>Tentar novamente</button>
        <p id="resumo" role="status"></p>
    </main>
</body>
</html>
